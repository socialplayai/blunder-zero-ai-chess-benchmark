[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blunder-zero-ai-chess-benchmark"
version = "0.1.0"
description = "A reproducible benchmark for general purpose AI models playing chess without engine assistance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["chess>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bzbench = "bzbench.cli:main"

[tool.setuptools]
packages = ["bzbench", "bzbench.adapters"]
